spring.application.name=TraceNest-Backend
spring.classformat.ignore=true

# ==============================================================================
# Server & Network Configuration
# ==============================================================================
server.port=${PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://localhost:3000,https://tracenest.app}

# ==============================================================================
# PostgreSQL Database Configuration
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tracenest}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==============================================================================
# JWT Authentication Security
# ==============================================================================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
app.jwt.secret=${APP_JWT_SECRET:VGhpcyBpcyBhIHZlcnkgc2VjdXJlIHNlY3JldCBrZXkgZm9yIEpXVA==}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:2592000000}

# ==============================================================================
# Cloudinary Media Storage (Images & Posters)
# ==============================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:mock_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:mock_secret}

# Multipart Upload Limits (max 5MB per image, up to 25MB total per request)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# ==============================================================================
# Mail Delivery Configuration (Spring Mail / SMTP)
# ==============================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==============================================================================
# Twilio SMS Configuration (Emergency Phone Alerts)
# ==============================================================================
twilio.account-sid=${TWILIO_ACCOUNT_SID:mock_sid}
twilio.auth-token=${TWILIO_AUTH_TOKEN:mock_token}
twilio.phone-number=${TWILIO_PHONE_NUMBER:+9999999999}

# ==============================================================================
# Application Logging
# ==============================================================================
logging.level.com.tracenest.backend=${LOGGING_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:DEBUG}
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.cors=TRACE

# ==============================================================================
# Actuator & Health Check Configuration
# ==============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false

