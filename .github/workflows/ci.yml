name: TraceNest Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Backend Verification (Java 21 / Spring Boot 3.4.3 / Maven)
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Test Backend
        working-directory: ./TraceNest-Backend
        run: |
          mvn --batch-mode clean test

  # ----------------------------------------------------------------------------
  # Frontend Verification (Node.js 20 / TypeScript / Vite / ESLint)
  # ----------------------------------------------------------------------------
  frontend-test:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./TraceNet-Frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./TraceNet-Frontend
        run: npm ci || npm install

      - name: Lint Codebase
        working-directory: ./TraceNet-Frontend
        run: npm run lint

      - name: Build Production Bundle
        working-directory: ./TraceNet-Frontend
        run: npm run build

